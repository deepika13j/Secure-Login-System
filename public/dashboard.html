
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Secure Login System</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="auth-card dashboard-card">
    <div class="shield">🛡️</div>
    <h1>Secure Dashboard</h1>
    <p id="welcomeMessage" class="subtitle">Checking your session...</p>

    <p class="security-note">
      You are viewing your account dashboard.
    </p>

    <button id="logoutButton" type="button">Log Out</button>
    <p id="dashboardMessage" class="message" role="status"></p>
  </main>
</body>
</html>
